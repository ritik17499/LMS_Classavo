# Render Blueprint — provisions frontend + backend + PostgreSQL in one shot.
#
# Environment wiring:
#   - NEXT_PUBLIC_API_URL / CORS_ALLOWED_ORIGINS: hardcoded (Render's fromService
#     only supports host/hostport/port for web services — no full URL property)
#   - ALLOWED_HOSTS: fromService host (short name; settings.py appends .onrender.com)
#   - DB_*: fromDatabase references resolved by Render before container starts
#
# Free-tier limits:
#   - Web services spin down after 15 min of inactivity (~30 s cold start).
#     Change plan: free → plan: starter ($7/mo each) for always-on.
#   - Managed PostgreSQL free instances are paused after 90 days of inactivity.

services:

  # ── Next.js frontend ─────────────────────────────────────────────────────────
  - type: web
    name: lms-frontend
    env: docker
    dockerContext: ./frontend
    dockerfilePath: ./frontend/Dockerfile
    plan: free
    envVars:
      # Resolved before npm run build so the URL is baked into the JS bundle.
      # fromService property:url is not supported for web services on Render,
      # and property:host omits .onrender.com — hardcode the full public URL.
      - key: NEXT_PUBLIC_API_URL
        value: https://lms-backend-7k8a.onrender.com

  # ── Django backend ────────────────────────────────────────────────────────────
  - type: web
    name: lms-backend
    env: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    plan: free
    healthCheckPath: /health/
    envVars:
      - key: SECRET_KEY
        generateValue: true   # Render generates a cryptographically secure value

      - key: DEBUG
        value: false

      # property:host gives the short name (e.g. lms-backend-7k8a, no .onrender.com);
      # settings.py appends .onrender.com as a wildcard in production mode.
      - key: ALLOWED_HOSTS
        fromService:
          name: lms-backend
          type: web
          property: host

      # fromService property:url is not supported; hardcode the frontend public URL.
      - key: CORS_ALLOWED_ORIGINS
        value: https://lms-frontend-83jm.onrender.com

      - key: DB_HOST
        fromDatabase:
          name: lms-postgres
          property: host

      - key: DB_PORT
        fromDatabase:
          name: lms-postgres
          property: port

      - key: DB_NAME
        fromDatabase:
          name: lms-postgres
          property: database

      - key: DB_USER
        fromDatabase:
          name: lms-postgres
          property: user

      - key: DB_PASSWORD
        fromDatabase:
          name: lms-postgres
          property: password

# ── Managed PostgreSQL ────────────────────────────────────────────────────────
databases:
  - name: lms-postgres
    databaseName: lms_db
    user: lms_user
    plan: free
